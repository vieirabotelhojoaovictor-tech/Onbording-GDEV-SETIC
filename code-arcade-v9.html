<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CODE ARCADE — Onboarding da CODE</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b1230;--bg2:#111a40;--card:#16225a;--ln:#2b3f9e;--blue:#2f6bff;--pur:#8b5cf6;--cy:#22d3ee;--yel:#fbbf24;--grn:#34d399;--red:#f87171;--tx:#e8edff;--mu:#a9b8ec;--px:'Press Start 2P',ui-monospace,monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:auto;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.55 Inter,system-ui,sans-serif;background-image:linear-gradient(rgba(47,107,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(47,107,255,.07) 1px,transparent 1px);background-size:24px 24px}
#ca{max-width:1040px;margin:0 auto;padding:16px}
h1,h2,h3{font-family:var(--px);font-weight:400;line-height:1.6;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
.box{background:var(--card);border:3px solid var(--ln);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ln),6px 6px 0 5px rgba(0,0,0,.35)}
.hud{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:10px 14px;margin:6px 5px 26px;background:var(--bg2)}
.hud .px{font-family:var(--px);font-size:11px}
.hud .xpw{flex:1;min-width:160px}
.bar{height:14px;background:#080d26;border:2px solid var(--ln);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--cy);transition:width .6s ease}
.bar.xp i{background:repeating-linear-gradient(90deg,var(--yel) 0 8px,#d99a0b 8px 10px)}
.ib{background:var(--card);border:2px solid var(--ln);padding:6px 10px;font-size:13px}
.ib:hover{border-color:var(--cy)}.ib:active{transform:translateY(2px)}
#view.in{animation:inn .35s ease-out}
@keyframes inn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hero{text-align:center;padding:28px 18px 34px;margin:0 5px}
.hero svg.sp{width:120px;height:144px;image-rendering:pixelated;animation:bob 1.6s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.logo{display:inline-block;border:2px solid var(--cy);padding:4px 10px;font-family:var(--px);font-size:10px;color:var(--cy);margin-bottom:14px}
h1{font-size:clamp(22px,5vw,40px);color:var(--yel);text-shadow:3px 3px 0 var(--pur)}
.sub{font-family:var(--px);font-size:12px;color:var(--cy);margin:14px 0 18px}
.hero p{max-width:640px;margin:10px auto;color:var(--mu)}
.load{width:240px;margin:18px auto}.load i{animation:ld 1.4s steps(12) forwards}
@keyframes ld{to{width:100%}}
.btn{font-family:var(--px);font-size:13px;color:#08102e;background:var(--yel);border:3px solid #fff3c4;padding:16px 22px;box-shadow:0 6px 0 #a8760a;animation:pulse 2s ease-in-out infinite;transition:box-shadow .2s,filter .2s}
.btn:hover{box-shadow:0 6px 0 #a8760a,0 0 22px rgba(251,191,36,.7);filter:brightness(1.08)}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #a8760a;animation:none}
@keyframes pulse{50%{transform:scale(1.04)}}
.note{font-size:13px;color:var(--mu);margin-top:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:26px;margin:22px 5px}
.lv{text-align:left;padding:16px;display:flex;flex-direction:column;gap:8px;transition:transform .2s}
.lv:hover,.lv:focus-visible{transform:scale(1.035);animation:glow 1.4s ease-in-out infinite}
.lv:hover .ic{animation:characterBob 1.8s ease-in-out infinite}
@keyframes glow{50%{border-color:var(--cy);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--cy),0 0 18px var(--cy)}}
@keyframes characterBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.lv .n{font-family:var(--px);font-size:10px;color:var(--cy)}.lv h3{font-size:12px}.ic{font-size:30px;display:inline-block}
.lv small{color:var(--mu)}.chip{align-self:flex-start;font-family:var(--px);font-size:9px;padding:5px 7px;border:2px solid}
.st-open .chip{color:var(--cy)}.st-done .chip{color:var(--grn)}.st-lock .chip{color:var(--red)}.st-lock{opacity:.8}.st-done{border-color:var(--grn)}
.sec{margin:34px 5px 0}.sec h2{font-size:13px;color:var(--yel);margin-bottom:16px}
.bg{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}
.bd{padding:12px;text-align:center;font-size:13px}.bd svg{width:54px;height:54px;image-rendering:pixelated}.bd b{display:block;font-size:13px}
.bd.lk svg{filter:grayscale(1) brightness(.5)}.bd.lk{opacity:.75}.bd.new svg{animation:pop .8s}
@keyframes pop{0%{transform:scale(0) rotate(-180deg)}70%{transform:scale(1.3) rotate(10deg)}100%{transform:none}}
.hist{list-style:none;padding:12px 16px;margin:0}.hist li{padding:4px 0;border-bottom:1px dashed var(--ln)}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 5px 18px}
.pn{padding:18px;margin:0 5px 26px}.pn h2{font-size:clamp(14px,3vw,20px);color:var(--yel)}.pn .sb{color:var(--cy);margin:6px 0 12px}
.pn p{margin:4px 0}.cols{display:grid;grid-template-columns:2fr 1fr;gap:26px;margin:0 5px}
@media(max-width:760px){.cols{grid-template-columns:1fr}}
h3.s{font-size:11px;color:var(--cy);margin:4px 0 12px}
.ms{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--bg2);border:2px solid var(--ln);padding:11px 12px;margin-bottom:10px;transition:transform .15s,border-color .2s}
.ms:hover{border-color:var(--cy);transform:translateX(4px)}.ms:active{transform:scale(.98)}
.cb{flex:none;width:24px;height:24px;border:2px solid var(--cy);display:grid;place-items:center;color:#08102e;font-weight:700}
.ms.on{border-color:var(--grn)}.ms.on .cb{background:var(--grn);border-color:var(--grn);animation:pop .5s}.ms.on .mt{color:var(--mu)}
.mt{flex:1}.xx{font-family:var(--px);font-size:9px;color:var(--yel)}
.mh{margin:14px 0 8px;font-weight:600}.subs{margin-left:18px}
.rw{list-style:none;padding:0;margin:0}.rw li{margin-bottom:10px}
.npc{display:flex;gap:12px;align-items:flex-start;padding:14px;animation:inn .5s}
.npc svg{flex:none;width:60px;height:72px;image-rendering:pixelated;animation:bob 1.6s steps(2) infinite}
.say{background:#fff;color:#0b1230;padding:10px 12px;border:3px solid var(--cy);position:relative;font-size:14px;margin-top:6px}
.say:before{content:"";position:absolute;left:-12px;top:14px;border:6px solid transparent;border-right-color:var(--cy)}
.fx{position:fixed;z-index:50;font-family:var(--px);font-size:16px;color:var(--yel);text-shadow:2px 2px 0 #000;pointer-events:none;animation:up 1.1s ease-out forwards}
@keyframes up{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-70px)}}
#vic{position:fixed;inset:0;z-index:60;background:rgba(5,8,25,.88);display:grid;place-items:center;padding:16px;overflow:auto}
#vic[hidden]{display:none}
.vb{max-width:440px;text-align:center;padding:26px;position:relative;overflow:hidden;animation:pop .6s}
.vb h2{color:var(--grn);font-size:16px;margin-bottom:12px}.vb svg.m{width:96px;height:96px;image-rendering:pixelated;animation:pop 1s}
.vb .npc{text-align:left}.cf{position:absolute;top:-10px;width:8px;height:8px;animation:fall 2.2s linear infinite}
@keyframes fall{to{transform:translateY(520px) rotate(360deg)}}
.det{margin:-4px 0 14px 36px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.nt{flex-basis:100%;margin:0;color:var(--mu);font-size:14px}
.lk{display:inline-block;background:transparent;border:2px solid var(--cy);color:var(--cy);padding:6px 10px;font-size:13px;text-decoration:none}
.lk:hover{background:var(--cy);color:#08102e}
.pps{display:flex;gap:14px;flex-basis:100%;flex-wrap:wrap}.pp{margin:0;text-align:center;width:100px;font-size:13px}.pp small{display:block;color:var(--mu)}
.ph{display:grid;place-items:center;width:72px;height:72px;margin:0 auto 4px;border-radius:50%;border:3px solid var(--yel);overflow:hidden;background:var(--bg2);font-family:var(--px);font-size:14px}
.ph img{width:100%;height:100%;object-fit:cover}
.tl{list-style:none;margin:16px 0 0;padding:0 0 0 18px;border-left:4px solid var(--ln)}.tl li{margin-bottom:20px;animation:inn .5s both}
.gt{margin:0 5px 8px;color:var(--yel);font-family:var(--px);font-size:12px}.gn{margin:0 5px 12px;color:var(--mu)}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

/* ===== CODE ARCADE / PREMIUM LANDING (inspirado na direção visual Aller Studio) ===== */
body.start-screen{background:#090b10;background-image:radial-gradient(ellipse at 78% 42%,rgba(40,91,255,.19),transparent 38%),radial-gradient(ellipse at 20% 85%,rgba(119,54,207,.16),transparent 34%);overflow-x:hidden}
body.start-screen:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.22;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:72px 72px;mask-image:linear-gradient(to bottom,black,transparent 92%)}
body.start-screen #ca{position:relative;z-index:1;max-width:none;min-height:100svh;padding:0 5.2vw 30px;display:flex;flex-direction:column}
body.start-screen #hud,body.start-screen #ca>footer{display:none}
body.start-screen #view{flex:1;display:flex;min-height:calc(100svh - 30px)}
.landing{position:relative;width:100%;min-height:calc(100svh - 30px);display:flex;flex-direction:column;overflow:hidden}
.landing:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.12;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.08) 4px);mix-blend-mode:screen}
.landing-nav{height:94px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.13);position:relative;z-index:3}
.brand-lock{display:flex;align-items:center;gap:13px;color:#fff;font-weight:800;letter-spacing:.13em;font-size:13px}
.brand-mark{width:38px;height:38px;border:1px solid rgba(255,255,255,.6);border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(46,107,255,.35),rgba(139,92,246,.2));box-shadow:0 0 28px rgba(47,107,255,.22);font-size:18px}
.nav-right{display:flex;align-items:center;gap:18px;color:#9ba3b6;font-size:10px;letter-spacing:.18em;text-transform:uppercase}
.nav-status{display:flex;align-items:center;gap:8px}.nav-status:before{content:"";width:7px;height:7px;border-radius:50%;background:#62e6b4;box-shadow:0 0 12px #62e6b4}
.sound-toggle{background:transparent;border:1px solid rgba(255,255,255,.2);color:#e9ecf4;padding:10px 13px;border-radius:999px;font-size:11px;letter-spacing:.08em;transition:.25s}
.sound-toggle:hover{border-color:#8c9cff;background:rgba(255,255,255,.07);transform:translateY(-2px)}
.landing-main{position:relative;z-index:2;flex:1;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(380px,.95fr);align-items:center;gap:3vw;padding:54px 0 42px}
.landing-copy{position:relative;z-index:3;max-width:760px;animation:landIn .9s cubic-bezier(.2,.7,.2,1) both}
.eyebrow{display:flex;align-items:center;gap:12px;color:#a8b4d0;font-size:10px;letter-spacing:.25em;text-transform:uppercase;margin-bottom:27px}
.eyebrow:before{content:"";width:34px;height:1px;background:#7f8fff;box-shadow:0 0 12px #7f8fff}
.landing-title{font-family:Inter,system-ui,sans-serif!important;font-size:clamp(58px,9.2vw,142px)!important;line-height:.82!important;letter-spacing:-.095em!important;font-weight:800!important;color:#f5f6fa!important;text-shadow:none!important;margin:0 0 24px!important;max-width:850px}
.landing-title span{display:block;color:transparent;background:linear-gradient(100deg,#f6f7fb 5%,#b9c7ff 48%,#8c73ff 92%);background-clip:text;-webkit-background-clip:text}
.landing-sub{font-size:clamp(15px,1.6vw,21px);line-height:1.45;color:#d3d9e8;font-weight:500;letter-spacing:-.025em;margin:0 0 16px}
.landing-desc{font-size:14px;line-height:1.8;color:#929bb0;max-width:540px;margin:0 0 34px}
.start-actions{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.start-cta{position:relative;display:inline-flex;align-items:center;gap:22px;padding:17px 22px;border:1px solid rgba(178,190,255,.75);border-radius:5px;background:linear-gradient(110deg,#f4f6ff,#cfd7ff);color:#0b1020;font:800 11px Inter,system-ui,sans-serif;letter-spacing:.16em;box-shadow:0 10px 35px rgba(83,108,255,.2);transition:transform .25s,box-shadow .25s,background .25s;animation:ctaBreath 3s ease-in-out infinite}
.start-cta .arrow{font-size:18px;line-height:1;transition:transform .25s}
.start-cta:hover{transform:translateY(-4px);box-shadow:0 15px 42px rgba(83,108,255,.38);background:#fff}
.start-cta:hover .arrow{transform:translateX(5px)}
.start-cta:active{transform:translateY(1px) scale(.985)}
.start-hint{color:#7e879b;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.landing-art{position:relative;min-height:530px;display:flex;align-items:center;justify-content:center;isolation:isolate;animation:landIn 1.1s .12s cubic-bezier(.2,.7,.2,1) both}
.art-glow{position:absolute;width:min(39vw,510px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(67,102,255,.28),rgba(104,70,214,.12) 44%,transparent 70%);filter:blur(14px);animation:glowDrift 8s ease-in-out infinite}
.art-ring{position:absolute;width:min(39vw,480px);aspect-ratio:1;border:1px solid rgba(150,166,255,.22);border-radius:50%;transform:rotate(-24deg) scaleY(.72);box-shadow:0 0 70px rgba(74,102,255,.12),inset 0 0 50px rgba(74,102,255,.08);animation:ringSpin 28s linear infinite}
.art-ring:before,.art-ring:after{content:"";position:absolute;border:1px solid rgba(150,166,255,.15);border-radius:50%;inset:26px;transform:rotate(38deg)}
.art-ring:after{inset:62px;transform:rotate(-55deg)}
.art-cross{position:absolute;width:11px;height:11px;border:1px solid #9baaff;transform:rotate(45deg);box-shadow:0 0 15px #758cff;top:17%;right:14%}
.art-orb{position:absolute;width:8px;height:8px;border-radius:50%;background:#a9b5ff;box-shadow:0 0 20px 5px rgba(125,145,255,.55);left:15%;bottom:22%;animation:orbFloat 4s ease-in-out infinite}
.team-stage{position:relative;width:min(100%,590px);height:475px;display:flex;align-items:flex-end;justify-content:center;gap:clamp(7px,1.4vw,22px);padding:0 10px 8px}
.team-card{position:relative;width:30%;max-width:174px;height:clamp(260px,31vw,390px);border-radius:90px 90px 9px 9px;overflow:hidden;border:1px solid rgba(191,201,255,.28);background:linear-gradient(180deg,rgba(63,84,155,.25),rgba(16,21,42,.94));box-shadow:0 20px 70px rgba(0,0,0,.38);transform:translateY(18px);transition:transform .45s,border-color .35s,filter .35s;animation:avatarRise .9s both}
.team-card:nth-child(1){animation-delay:.18s;transform:translateY(28px) rotate(-4deg)}
.team-card:nth-child(2){height:clamp(300px,35vw,430px);z-index:2;animation-delay:.34s}
.team-card:nth-child(3){animation-delay:.5s;transform:translateY(28px) rotate(4deg)}
.team-card:hover{transform:translateY(-12px) scale(1.035)!important;border-color:rgba(181,195,255,.85);filter:brightness(1.12);z-index:4}
.team-card img{width:100%;height:100%;object-fit:cover;object-position:center 25%;display:block;filter:saturate(.82) contrast(1.04);mask-image:linear-gradient(to bottom,#000 72%,transparent 100%)}
.team-card:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 48%,rgba(8,11,24,.96) 100%),linear-gradient(135deg,rgba(103,126,255,.12),transparent 48%);pointer-events:none}
.team-meta{position:absolute;z-index:2;bottom:18px;left:13px;right:10px;text-align:left}
.team-meta small{display:block;color:#9ca9d0;font-size:8px;letter-spacing:.2em;margin-bottom:5px}
.team-meta strong{display:block;color:#fff;font-size:12px;letter-spacing:.02em}
.art-caption{position:absolute;right:0;bottom:0;color:#727e9a;font-size:9px;letter-spacing:.2em;text-transform:uppercase}
.landing-foot{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:17px 0 0;border-top:1px solid rgba(255,255,255,.12);color:#69748d;font-size:9px;letter-spacing:.16em;text-transform:uppercase;position:relative;z-index:2}
.landing-foot strong{color:#aeb9d5;font-weight:600}
.landing-index{display:flex;align-items:center;gap:10px}.landing-index:before{content:"";width:28px;height:1px;background:#788cff}
@keyframes landIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes avatarRise{from{opacity:0;translate:0 35px}to{opacity:1;translate:0 0}}
@keyframes ringSpin{to{transform:rotate(336deg) scaleY(.72)}}
@keyframes glowDrift{50%{transform:scale(1.1) translate(10px,-12px);opacity:.8}}
@keyframes orbFloat{50%{transform:translate(18px,-26px)}}
@keyframes ctaBreath{50%{box-shadow:0 10px 42px rgba(83,108,255,.32)}}
@media(max-width:900px){body.start-screen #ca{padding:0 25px 22px}.landing-main{grid-template-columns:1fr;gap:8px;padding:58px 0 25px}.landing-copy{max-width:760px}.landing-art{min-height:390px;margin-top:5px}.team-stage{height:390px}.team-card{height:300px}.team-card:nth-child(2){height:350px}.art-glow{width:370px}.art-ring{width:350px}.landing-title{font-size:clamp(60px,12vw,105px)!important}.landing-foot{margin-top:8px}}
@media(max-width:560px){body.start-screen #ca{padding:0 18px 18px}.landing-nav{height:72px}.brand-lock{font-size:10px}.brand-mark{width:32px;height:32px}.nav-right{gap:10px;font-size:8px}.nav-status{display:none}.sound-toggle{padding:8px 10px}.landing-main{padding:46px 0 22px}.eyebrow{font-size:8px;margin-bottom:22px}.landing-title{font-size:clamp(52px,14vw,76px)!important}.landing-sub{font-size:16px}.landing-desc{font-size:13px;margin-bottom:25px}.start-cta{padding:15px 17px;font-size:10px}.start-hint{font-size:8px}.landing-art{min-height:310px;margin:0 -5px}.team-stage{height:310px;gap:7px}.team-card{height:235px;border-radius:70px 70px 8px 8px}.team-card:nth-child(2){height:275px}.team-meta{left:8px;bottom:12px}.team-meta strong{font-size:10px}.team-meta small{font-size:7px}.art-glow{width:280px}.art-ring{width:270px}.art-caption{font-size:7px}.landing-foot{font-size:7px;letter-spacing:.1em}.landing-foot .foot-right{display:none}}
@media(prefers-reduced-motion:reduce){.landing-copy,.landing-art,.team-card,.art-ring,.art-glow,.art-orb,.start-cta{animation:none!important;transition:none!important}}

/* ===== Materiais de onboarding por gerência ===== */
.deck-wrap{margin:0 5px 24px;padding:16px;background:rgba(12,17,35,.78);border:1px solid rgba(130,151,255,.25);border-radius:14px;box-shadow:0 18px 55px rgba(0,0,0,.22)}
.deck-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.deck-head strong{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#dce4ff}
.deck-head a{color:#9db2ff;font-size:12px;text-decoration:none;border:1px solid rgba(157,178,255,.4);border-radius:999px;padding:7px 11px}
.deck-head a:hover{background:rgba(120,143,255,.15);border-color:#9db2ff}
.deck-frame{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:9px;background:#090d1c;border:1px solid rgba(255,255,255,.12)}
.deck-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.wiki-ref{margin:0 5px 20px;padding:13px 16px;border:1px solid rgba(34,211,238,.3);border-radius:12px;background:rgba(34,211,238,.06);font-size:13px}
.wiki-ref a{color:#8deafa}
@media(max-width:560px){.deck-wrap{padding:10px;margin-left:0;margin-right:0}.deck-head strong{font-size:11px}.deck-head a{font-size:10px}}


/* Atualizações: programação no hero, seleção premium e missões em nova aba */
.code-scene{min-height:530px}
.code-window{position:relative;z-index:2;width:min(88%,490px);min-height:330px;border:1px solid rgba(163,179,255,.34);border-radius:15px;background:linear-gradient(145deg,rgba(24,31,58,.96),rgba(8,12,26,.97));box-shadow:0 35px 100px rgba(0,0,0,.5),0 0 65px rgba(89,111,255,.17);transform:perspective(900px) rotateY(-8deg) rotateX(3deg);animation:editorFloat 7s ease-in-out infinite}
.code-top{height:48px;display:flex;align-items:center;gap:7px;padding:0 16px;border-bottom:1px solid rgba(255,255,255,.09)}

 if(id&&!S.t[id]&&!moKind){if(w){pend={id,t:Date.now()};toast('Link aberto em nova aba. Ao voltar, a missão é contabilizada.')}else{complete(id);location.href=u}}}
function chkPend(){if(pend&&document.visibilityState==='visible'&&Date.now()-pend.t>2500){const id=pend.id;pend=null;complete(id);toast('Missão contabilizada ✓')}}
document.addEventListener('visibilitychange',chkPend);addEventListener('focus',chkPend);
function openModal(h,kind,id){const m=$('#mo');m.innerHTML=h;m.hidden=false;moKind=kind;moId=id||null}
function closeModal(){if(!moKind)return;const k=moKind,id=moId;moKind=moId=null;$('#mo').hidden=true;if(k==='task'&&id)complete(id)}
$('#mo').addEventListener('click',e=>{if(e.target.id==='mo'&&moKind==='task')closeModal()});
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&moKind==='task')closeModal()});
function taskModal(id){const I=taskInfo(parseInt(id),id),d=!!S.t[id];
 const g=I.guidance?.length?`<div class="activity-resources"><b>PASSOS ESSENCIAIS</b><ol>${I.guidance.map(x=>`<li>${x}</li>`).join('')}</ol></div>`:'';
 const p=I.people?.length?`<div class="activity-resources"><b>PESSOAS DE REFERÊNCIA</b>${I.people.map(pp).join('')}</div>`:'';
 const b=I.links.map(x=>`<button class="lk" data-a="ext" data-u="${btoa(x[1])}">🔗 ${x[0]} ↗</button>`).join('')+(I.a?`<button class="lk" data-a="${I.a[0]}">${I.a[1]} →</button>`:'');
 openModal(`<div class="mb"><button class="ib mx" data-a="mclose" aria-label="Fechar">✕</button><div class="activity-mark">MISSÃO · ${d?'CONCLUÍDA':'LEIA E FECHE PARA CONCLUIR'}</div><h2 class="mh2">${I.title}</h2><p>${I.description}</p>${g}${b?`<div class="activity-resources"><b>ACESSOS</b><div>${b}</div></div>`:''}${p}<div class="activity-complete"><button class="final-button" data-a="mclose">${d?'FECHAR':'ENTENDI · CONCLUIR ✓'}</button></div></div>`,'task',id)}
function whoModal(){openModal(`<div class="mb"><div class="activity-mark">BEM-VINDO(A)</div><h2 class="mh2">Quem é você?</h2><p>Informe seu nome para registrar seu progresso no onboarding.</p><input id="wn" class="in" placeholder="Seu nome completo" maxlength="60"><div class="activity-complete"><button class="final-button" data-a="whoSave">COMEÇAR ✓</button></div></div>`,'who')}
async function hash(p,s){const d=s+':'+p;if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(d));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}let h=5381;for(const c of d)h=(h*33^c.charCodeAt(0))>>>0;return'x'+h}
const inviteTok=()=>(location.hash.match(/^#convite=(\w+)/)||[])[1];
function admin(){const a=A(),me=sessionStorage.getItem(SES),tok=inviteTok(),back='<div class="top"><button class="ib" data-a="sel">← Voltar</button></div>';
 const form=(t,sub,x,btn,act)=>`${back}<section class="pn box" style="max-width:520px"><h2>🔒 ${t}</h2><div class="sb">${sub}</div>${x}<input id="au" class="in" placeholder="Usuário" autocomplete="username" maxlength="30"><input id="ap" class="in" type="password" placeholder="Senha (mín. 6 caracteres)" autocomplete="current-password"><p id="aerr" class="note" style="color:var(--red)"></p><button class="final-button" data-a="${act}">${btn}</button></section>`,nm='<input id="an" class="in" placeholder="Seu nome" maxlength="60">';
 if(tok&&!me)return a.inv.some(i=>i.t===tok&&i.exp>Date.now())?form('Cadastro de chefe','Convite válido. Crie seu acesso.',nm,'CRIAR ACESSO','admSignup'):form('Convite inválido','Expirado, já usado ou gerado em outro navegador.','','ENTRAR','admLogin');
 if(!a.chefs.length)return form('Primeiro acesso','Crie o administrador (primeiro chefe).',nm,'CRIAR ADMINISTRADOR','admSignup');
 if(!me)return form('Área dos chefes','Acesso restrito. Entre com seu usuário.','','ENTRAR','admLogin');
 if(SYNC_URL&&!admFetched){admFetched=1;fetch(SYNC_URL).then(r=>r.json()).then(arr=>{const r=getReg();arr.forEach(p=>{if(!r[p.id]||p.upd>r[p.id].upd)r[p.id]=p});localStorage.setItem(REG,JSON.stringify(r));if(cur.v==='admin')go('admin')}).catch(()=>{})}
 const ppl=Object.values(getReg()).sort((x,y)=>y.upd-x.upd),c=a.chefs.find(x=>x.u===me);
 return`<div class="top"><button class="ib" data-a="sel">← Voltar</button><span><button class="ib" data-a="groups">👥 Gerenciar grupos</button> <button class="ib" data-a="admOut">Sair</button></span></div><section class="pn box"><h2>🔒 Painel dos chefes</h2><div class="sb">Olá, ${esc(c?c.name:me)}</div>${SYNC_URL?'':'<p class="note">Modo local: aparecem apenas as pessoas que usaram este navegador. Configure SYNC_URL para acompanhar todos.</p>'}</section>
<section class="pn box"><h3 class="s">ACOMPANHAMENTO (${ppl.length})</h3><div class="tw"><table class="tb"><thead><tr><th>Nome</th><th>XP</th><th>Fases</th><th>Missões</th><th>Última atividade</th><th></th></tr></thead><tbody>${ppl.map(p=>`<tr><td>${esc(p.name)}</td><td>${+p.xp||0}</td><td>${+p.lv||0}/5</td><td>${Object.keys(p.t||{}).length}</td><td>${new Date(p.upd).toLocaleString('pt-BR')}</td><td>${Object.keys(p.ts||{}).length?`<button class="mission-open" data-a="admStatus" data-id="${esc(p.id)}">STATUS</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6">Ninguém registrado ainda.</td></tr>'}</tbody></table></div><div id="stbox"></div></section>
<section class="pn box"><h3 class="s">NOVO CHEFE · QR CODE</h3><p>Convite válido por 24 horas e de uso único.</p><button class="final-button" data-a="admInvite">GERAR QR CODE</button><div id="qrbox"></div><p class="note">Chefes cadastrados: ${a.chefs.map(x=>esc(x.name)).join(', ')}</p></section>`}
async function admSignup(){const u=$('#au').value.trim().toLowerCase(),p=$('#ap').value,nm=($('#an')?.value||'').trim(),e=$('#aerr'),a=A();
 if(!u||!nm||p.length<6){e.textContent='Preencha nome, usuário e senha (mín. 6 caracteres).';return}
 if(a.chefs.some(c=>c.u===u)){e.textContent='Esse usuário já existe.';return}
 if(a.chefs.length){const i=a.inv.findIndex(x=>x.t===inviteTok()&&x.exp>Date.now());if(i<0){e.textContent='Convite inválido.';return}a.inv.splice(i,1)}
 const s=rnd();a.chefs.push({u,name:nm,s,h:await hash(p,s)});setA(a);sessionStorage.setItem(SES,u);history.replaceState(null,'',location.pathname+location.search);go('admin')}
async function admLogin(){const u=$('#au').value.trim().toLowerCase(),c=A().chefs.find(x=>x.u===u);
 if(c&&c.h===await hash($('#ap').value,c.s)){sessionStorage.setItem(SES,u);history.replaceState(null,'',location.pathname+location.search);go('admin')}else $('#aerr').textContent='Usuário ou senha incorretos.'}
function admInvite(){const t=rnd(),a=A();a.inv=a.inv.filter(i=>i.exp>Date.now());a.inv.push({t,exp:Date.now()+864e5});setA(a);const url=location.href.split('#')[0]+'#convite='+t;
 $('#qrbox').innerHTML=`<div id="qr" class="qr"></div><input class="in" readonly value="${esc(url)}"><button class="ib" data-a="copy" data-u="${esc(url)}">Copiar link</button>`;
 if(window.QRCode)new QRCode($('#qr'),{text:url,width:210,height:210});else $('#qr').textContent='QR indisponível (sem internet). Use o link.'}
const fmt=d=>d<60?Math.round(d)+' s':d<3600?Math.round(d/60)+' min':(d/3600).toFixed(1)+' h';
function statusHtml(p){const ev=Object.values(p.ts||{}).map(v=>({t:v[0],n:v[1]})).sort((a,b)=>a.t-b.t);let fast=0;
 const rows=ev.map((e,i)=>{const d=i?(e.t-ev[i-1].t)/1000:null,f=d!==null&&d<FAST;if(f)fast++;return`<tr class="${f?'warn':''}"><td>${esc(e.n)}</td><td>${new Date(e.t).toLocaleString('pt-BR')}</td><td>${d===null?'—':fmt(d)}</td><td>${d===null?'':f?'⚠ muito curto':d<MID?'curto':'ok'}</td></tr>`}).join('');
 return`<h3 class="s" style="margin-top:18px">STATUS · ${esc(p.name)}</h3><p><b>${fast?`⚠ ${fast} conclusão(ões) com menos de ${FAST/60} min de intervalo.`:'✓ Ritmo compatível com estudo normal.'}</b> É um indicador, não prova: missões de leitura podem ser rápidas.</p><div class="tw"><table class="tb"><thead><tr><th>Missão</th><th>Concluída em</th><th>Intervalo</th><th>Avaliação</th></tr></thead><tbody>${rows}</tbody></table></div>`}
window.addEventListener('storage',e=>{if(e.key===KEY){try{const z=JSON.parse(e.newValue);if(z){S=Object.assign(fresh(),z);go(cur.v,cur.n,cur.from)}}catch(_){}}});
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&!$('#vic').hidden)$('#vic').hidden=true});
go('start');
if(location.hash.startsWith('#convite='))go('admin');
if(location.hash.startsWith('#atividade=')){try{const payload=JSON.parse(decodeURIComponent(location.hash.slice('#atividade='.length)));if(payload&&payload.id)go('activity',+payload.n,payload)}catch(_){}}
</script></body></html>
